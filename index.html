<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RMNFL League Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{navy:'#0a0e1a',card:'#0f1425',red:'#DC2626',gold:'#F59E0B'}}}};
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--card:#0f1425;--red:#dc2626;--gold:#f59e0b;--muted:#94a3b8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#e5e7eb;font-family:Inter,system-ui,sans-serif}
body{background-image:radial-gradient(circle at 15% 0%,rgba(220,38,38,.10),transparent 28%),radial-gradient(circle at 90% 20%,rgba(245,158,11,.07),transparent 25%)}
h1,h2,h3,.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:.05em}.glass{background:rgba(15,20,37,.88);border:1px solid rgba(148,163,184,.14);box-shadow:0 12px 40px rgba(0,0,0,.22);backdrop-filter:blur(12px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:.65rem;padding:.65rem .9rem;font-weight:700;font-size:.82rem;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn-red{background:var(--red);color:#fff}.btn-gold{background:var(--gold);color:#111827}.btn-dark{background:#182033;color:#e5e7eb;border:1px solid #293449}
.input,.select,.textarea{width:100%;background:#0a0f1d;border:1px solid #273248;color:#e5e7eb;border-radius:.55rem;padding:.68rem .75rem;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(220,38,38,.15)}.textarea{min-height:100px;resize:vertical}
.label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;font-weight:800;margin-bottom:.4rem}
.nav-scroll{scrollbar-width:none}.nav-scroll::-webkit-scrollbar{display:none}
.navitem{white-space:nowrap;border-bottom:2px solid transparent;color:#94a3b8;padding:.9rem .75rem;font-size:.78rem;font-weight:800}.navitem:hover{color:#fff}.navitem.active{color:#fff;border-color:var(--red)}
.ticker{overflow:hidden;white-space:nowrap}.ticker-track{display:inline-block;padding-left:100%;animation:ticker 30s linear infinite}@keyframes ticker{to{transform:translateX(-100%)}}
.kpi{position:relative;overflow:hidden}.kpi:after{content:'';position:absolute;right:-20px;top:-30px;width:90px;height:90px;border-radius:50%;background:rgba(220,38,38,.08)}
table{width:100%;border-collapse:collapse}th{color:#94a3b8;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:.75rem;border-bottom:1px solid #273248;cursor:pointer}td{padding:.72rem;border-bottom:1px solid rgba(39,50,72,.55);font-size:.82rem}tr:hover td{background:rgba(255,255,255,.015)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:.22rem .55rem;font-size:.68rem;font-weight:800}.final{background:rgba(34,197,94,.12);color:#86efac}.scheduled{background:rgba(245,158,11,.12);color:#fcd34d}.pending{background:rgba(148,163,184,.12);color:#cbd5e1}
.toast{position:fixed;right:1rem;bottom:1rem;z-index:100;min-width:260px;max-width:calc(100vw - 2rem);background:#111827;border:1px solid #334155;border-left:4px solid var(--red);border-radius:.7rem;padding:.85rem 1rem;box-shadow:0 15px 45px rgba(0,0,0,.4);animation:toast .2s ease}@keyframes toast{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}.modal-card{width:min(520px,100%);max-height:90vh;overflow:auto}
.hero{background:linear-gradient(135deg,rgba(220,38,38,.18),rgba(15,20,37,.8) 50%,rgba(245,158,11,.08));border-color:rgba(220,38,38,.28)}
@media(max-width:640px){.containerx{padding-left:.8rem;padding-right:.8rem}td,th{padding:.55rem .4rem}.hide-sm{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>
<script>
'use strict';

const NFL_TEAMS=[
["Arizona Cardinals","NFC","West"],["Atlanta Falcons","NFC","South"],["Baltimore Ravens","AFC","North"],["Buffalo Bills","AFC","East"],
["Carolina Panthers","NFC","South"],["Chicago Bears","NFC","North"],["Cincinnati Bengals","AFC","North"],["Cleveland Browns","AFC","North"],
["Dallas Cowboys","NFC","East"],["Denver Broncos","AFC","West"],["Detroit Lions","NFC","North"],["Green Bay Packers","NFC","North"],
["Houston Texans","AFC","South"],["Indianapolis Colts","AFC","South"],["Jacksonville Jaguars","AFC","South"],["Kansas City Chiefs","AFC","West"],
["Las Vegas Raiders","AFC","West"],["Los Angeles Chargers","AFC","West"],["Los Angeles Rams","NFC","West"],["Miami Dolphins","AFC","East"],
["Minnesota Vikings","NFC","North"],["New England Patriots","AFC","East"],["New Orleans Saints","NFC","South"],["New York Giants","NFC","East"],
["New York Jets","AFC","East"],["Philadelphia Eagles","NFC","East"],["Pittsburgh Steelers","AFC","North"],["San Francisco 49ers","NFC","West"],
["Seattle Seahawks","NFC","West"],["Tampa Bay Buccaneers","NFC","South"],["Tennessee Titans","AFC","South"],["Washington Commanders","NFC","East"]
];
const OWNERS=["Musah Abdul-Aziz","Zac Thomas","Jordan Reed","Marcus Johnson","Darius Williams","Chris Brown","Anthony Davis","Jamal Carter","DeAndre Smith","Kevin Lewis","Brandon Miller","Terrence Hall","Malik Jones","Andre Green","Ryan Cooper","Devon Harris"];
const POS=["QB","RB","WR","TE","OL","DL","LB","CB","S","K","P"];
const names=["A.J. Carter","J. Robinson","M. Johnson","D. Williams","C. Brown","K. Lewis","T. Hall","M. Jones","A. Green","R. Cooper","D. Harris","T. Reed","J. Davis","B. Miller","T. Smith","K. Carter","J. Green","M. Lewis","D. Brown","A. Williams","C. Johnson","R. Hall","A. Jones","R. Miller","T. Cooper","K. Davis","J. Harris","M. Smith","D. Carter","B. Green","M. Reed","D. Lewis","C. Davis","A. Miller","J. Hall","R. Jones","T. Williams","K. Brown","J. Carter","M. Green","D. Reed","C. Lewis","A. Davis","B. Harris","M. Cooper","T. Johnson","K. Smith","J. Williams","R. Carter","A. Green","M. Davis","D. Miller","C. Hall"];
function roster(team){return Array.from({length:53},(_,i)=>({num:i+1,name:names[i%names.length],pos:POS[i%POS.length],ovr:72+(i*7)%24,age:21+(i%13),speed:82+(i*5)%17}));}
function initData(){
 let teams=NFL_TEAMS.map((x,i)=>({id:i+1,name:x[0],conf:x[1],div:x[2],owner:OWNERS[i%OWNERS.length],password:"r" + String(i+1).padStart(2,"0"),w:(i*3)%10,l:(i*2)%8,t:i%3===0?1:0,pf:180+i*9,pa:165+i*7,streak:i%4===0?"W3":i%4===1?"L1":"W1"}));
 let games=[]; for(let w=1;w<=18;w++){for(let i=0;i<16;i++){let a=teams[(i+w*2)%32],h=teams[(i+w*2+16)%32];games.push({id:`W${w}-${i+1}`,week:w,away:a.name,home:h.name,date:`2026-${String(Math.min(12,Math.ceil((w+1)/2))).padStart(2,"0")}-${String(3+((w*3+i)%24)).padStart(2,"0")}`,time:"8:00 PM",status:w<4?"Final":"Scheduled",awayScore:w<4?(i*3+w)%35:null,homeScore:w<4?(i*5+w+7)%38:null});}}
 return {settings:{season:"Season 2026",week:4,commissioner:"RMNFL Commissioner",discord:"https://discord.gg/rmnfl",youtube:"https://youtube.com/",companion:"https://example.com/rmnfl-companion"},teams,games,announcements:[{id:1,title:"Welcome to RMNFL Season 2026",body:"League play is live. Check your schedule and keep communication moving."},{id:2,title:"Scheduling Window Reminder",body:"Games must be scheduled within 48 hours and played within 72 hours."}],trades:[],discipline:[],syncLog:[],highlights:["Week 3 thriller goes down to the final drive","Owner spotlight: Season 2026 is underway","Trade deadline watch: activity heating up"],streamSchedule:[{date:"Thursday 8:00 PM",title:"Prime Time Showcase"},{date:"Sunday 7:30 PM",title:"RMNFL Sunday Night"}]};
}
let data;
try{data=JSON.parse(localStorage.getItem("rmnflData"))||initData()}catch(e){data=initData()}
function save(){try{localStorage.setItem("rmnflData",JSON.stringify(data));}catch(e){toast("Could not save local data","error")}}
function toast(msg,type="ok"){let r=document.getElementById("toast-root"),el=document.createElement("div");el.className="toast";el.innerHTML=`<div class="font-bold">${type==="error"?"Error":"RMNFL"}</div><div class="text-sm text-slate-300 mt-1">${esc(msg)}</div>`;r.appendChild(el);setTimeout(()=>el.remove(),2800)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function icon(n,s="16"){return `<i data-lucide="${n}" width="${s}" height="${s}"></i>`}
let view=location.hash.slice(1)||"home", sortKey="w",sortDir=-1, selectedWeek=data.settings.week, selectedTeam=data.teams[0]?.id||1;

const NAV=[
["home","Home","house"],["standings","Standings","trophy"],["schedule","Schedule","calendar-days"],["scores","Scores","badge-check"],["rosters","Rosters","users"],
["rules","Rules","book-open"],["trade","Trade Block","arrow-left-right"],["media","Media","play-circle"],["owner","Owner Portal","shield-check"],["sync","Madden Sync","refresh-cw"],
["discord","Discord","message-circle"],["admin","Admin","settings"]
];

function shell(content){
 document.getElementById("app").innerHTML=`<header class="sticky top-0 z-50 bg-[#0a0e1a]/95 backdrop-blur border-b border-slate-800">
 <div class="containerx max-w-[1500px] mx-auto px-4 flex items-center justify-between gap-4 h-16">
 <button onclick="go('home')" class="flex items-center gap-3 shrink-0"><div class="w-10 h-10 rounded-lg bg-red-600 grid place-items-center font-black">RM</div><div><div class="bebas text-2xl leading-none">RMNFL</div><div class="text-[9px] uppercase tracking-[.25em] text-slate-500">League Platform</div></div></button>
 <div class="text-right hidden md:block"><div class="text-xs text-slate-500">${esc(data.settings.season)}</div><div class="text-sm font-bold text-red-400">WEEK ${data.settings.week}</div></div></div>
 <nav class="nav-scroll overflow-x-auto border-t border-slate-800"><div class="containerx max-w-[1500px] mx-auto px-2 flex min-w-max">${NAV.map(n=>`<button class="navitem ${view===n[0]?'active':''}" onclick="go('${n[0]}')">${icon(n[2],14)} ${n[1]}</button>`).join("")}</div></nav>
 </header>
 <div class="ticker bg-red-950/30 border-b border-red-900/30"><div class="ticker-track py-2 text-xs font-bold text-red-200">${data.announcements.map(a=>`<span class="mx-10">● ${esc(a.title)}</span>`).join("")}</div></div>
 <main class="containerx max-w-[1500px] mx-auto p-4 md:p-6">${content}</main>
 <footer class="max-w-[1500px] mx-auto px-4 pb-8 pt-4 text-xs text-slate-600 flex justify-between"><span>RMNFL League Platform • Local Mode</span><span>All changes saved in this browser</span></footer>`;
 try{lucide.createIcons()}catch(e){}
}
function go(v){view=v;location.hash=v;render()}
window.addEventListener("hashchange",()=>{view=location.hash.slice(1)||"home";render()});

function pageTitle(title,sub){return `<div class="mb-6"><div class="flex items-center gap-3"><div class="w-1 h-10 bg-red-600 rounded"></div><div><h1 class="text-4xl md:text-5xl">${title}</h1><p class="text-sm text-slate-400">${sub}</p></div></div></div>`}
function card(c){return `<div class="glass rounded-xl p-5 ${c||""}">`}
function home(){
 let finals=data.games.filter(g=>g.status==="Final").slice(-5).reverse(), upcoming=data.games.filter(g=>g.status!=="Final").slice(0,5);
 return pageTitle("RMNFL","The official Season 2026 league dashboard")+`
 <div class="hero glass rounded-2xl p-6 md:p-8 mb-6"><div class="flex flex-col md:flex-row md:items-end justify-between gap-5"><div><div class="text-red-400 font-black text-xs tracking-[.3em]">WELCOME TO</div><h2 class="text-6xl md:text-8xl mt-1">RMNFL</h2><p class="text-slate-300 max-w-xl">Competitive Madden football. One league. Thirty-two franchises. One champion.</p></div><div class="text-right"><div class="text-slate-400 text-sm">CURRENT SEASON</div><div class="bebas text-5xl text-gold">${esc(data.settings.season.replace("Season ",""))}</div><div class="badge scheduled">WEEK ${data.settings.week}</div></div></div></div>
 <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">${[
 ["Total Teams",data.teams.length,"users"],["Current Week",data.settings.week,"calendar"],["Games Played",data.games.filter(g=>g.status==="Final").length,"check-circle"],["Active Trades",data.trades.length,"arrow-left-right"]
 ].map(x=>card(`kpi`) + `<div class="flex justify-between"><div><div class="text-slate-500 text-xs uppercase">${x[0]}</div><div class="text-3xl font-black mt-2">${x[1]}</div></div><div class="text-red-500">${icon(x[2],22)}</div></div></div>`).join("")}</div>
 <div class="grid lg:grid-cols-2 gap-5"><section>${card()}<div class="flex justify-between mb-4"><h3 class="text-2xl">Recent Scores</h3><button class="btn btn-dark" onclick="go('scores')">View Scores</button></div>${finals.map(gameRow).join("")||empty("No completed games yet")}</div></section><section>${card()}<div class="flex justify-between mb-4"><h3 class="text-2xl">Upcoming Games</h3><button class="btn btn-dark" onclick="go('schedule')">Full Schedule</button></div>${upcoming.map(gameRow).join("")}</div></section></div>
 <section class="mt-5">${card()}<div class="flex justify-between items-center mb-4"><h3 class="text-2xl">League Announcements</h3><button class="btn btn-dark" onclick="go('admin')">Manage</button></div>${data.announcements.map(a=>`<div class="border-b border-slate-800 py-3 last:border-0"><div class="font-bold">${esc(a.title)}</div><div class="text-sm text-slate-400 mt-1">${esc(a.body)}</div></div>`).join("")}</div></section>`;
}
function empty(t){return `<div class="text-center py-8 text-slate-500">${icon("inbox",28)}<div class="mt-2">${t}</div></div>`}
function gameRow(g){return `<div class="border-b border-slate-800 py-3 last:border-0 flex items-center justify-between gap-3"><div class="min-w-0"><div class="font-bold text-sm truncate">${esc(g.away)} <span class="text-slate-500">@</span> ${esc(g.home)}</div><div class="text-xs text-slate-500">Week ${g.week} • ${esc(g.date)} ${esc(g.time)}</div></div><div class="text-right shrink-0">${g.status==="Final"?`<div class="font-black">${g.awayScore} - ${g.homeScore}</div><span class="badge final">FINAL</span>`:`<span class="badge scheduled">SCHEDULED</span>`}</div></div>`}

function standings(){
 let teams=[...data.teams].sort((a,b)=>{let av=a[sortKey],bv=b[sortKey];if(typeof av==="string")return sortDir*av.localeCompare(bv);return sortDir*((av??0)-(bv??0))});
 return pageTitle("Standings","AFC and NFC conference/division standings")+`<div class="grid xl:grid-cols-2 gap-5">${["AFC","NFC"].map(conf=>`${card()}<div class="flex justify-between mb-4"><h3 class="text-2xl">${conf}</h3><span class="text-xs text-slate-500">Click headers to sort</span></div><div class="overflow-x-auto"><table><thead><tr>${["Rank","Team Name","Owner","W","L","T","PF","PA","Streak"].map(k=>`<th onclick="sortBy('${k==="Team Name"?"name":k==="Owner"?"owner":k.toLowerCase()}')">${k}</th>`).join("")}</tr></thead><tbody>${teams.filter(t=>t.conf===conf).map((t,i)=>`<tr><td class="font-black">${i+1}</td><td class="font-bold">${esc(t.name)}</td><td>${esc(t.owner)}</td><td class="font-bold text-green-400">${t.w}</td><td class="text-red-400">${t.l}</td><td>${t.t}</td><td>${t.pf}</td><td>${t.pa}</td><td>${esc(t.streak)}</td></tr>`).join("")}</tbody></table></div></div>`).join("")}</div>`;
}
function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1}render()}

function schedule(){
 let games=data.games.filter(g=>g.week===Number(selectedWeek));
 return pageTitle("Schedule","Week-by-week league slate")+`${card()}<div class="flex flex-wrap gap-2 mb-5"><select class="select max-w-xs" onchange="selectedWeek=this.value;render()">${Array.from({length:18},(_,i)=>`<option value="${i+1}" ${selectedWeek==i+1?"selected":""}>Week ${i+1}</option>`).join("")}<option value="19" ${selectedWeek==19?"selected":""}>Playoffs</option></select><span class="badge ${games.some(g=>g.status==="Final")?"final":"scheduled"} self-center">${games.filter(g=>g.status==="Final").length} FINAL</span></div><div class="space-y-2">${games.map(g=>gameRow(g)+`<div class="flex justify-end -mt-2 mb-2"><button class="btn btn-dark" onclick="editGame('${g.id}')">${icon("pencil",14)} Manage</button></div>`).join("")}</div></div>`;
}
function editGame(id){let g=data.games.find(x=>x.id===id);if(!g)return;modal(`<h3 class="text-3xl mb-4">Manage Game</h3><div class="space-y-3"><div class="text-sm font-bold">${esc(g.away)} @ ${esc(g.home)}</div><div class="grid grid-cols-2 gap-3"><div><label class="label">Away Score</label><input id="eg-away" class="input" type="number" value="${g.awayScore??""}"></div><div><label class="label">Home Score</label><input id="eg-home" class="input" type="number" value="${g.homeScore??""}"></div></div><div><label class="label">Date</label><input id="eg-date" class="input" value="${esc(g.date)}"></div><div><label class="label">Time</label><input id="eg-time" class="input" value="${esc(g.time)}"></div><button class="btn btn-red w-full" onclick="saveGame('${id}')">Save Result</button></div>`)}
function saveGame(id){let g=data.games.find(x=>x.id===id),a=Number(document.getElementById("eg-away").value),h=Number(document.getElementById("eg-home").value);if(Number.isNaN(a)||Number.isNaN(h)||a<0||h<0)return toast("Enter valid scores","error");g.awayScore=a;g.homeScore=h;g.status="Final";g.date=document.getElementById("eg-date").value;g.time=document.getElementById("eg-time").value;let aw=data.teams.find(t=>t.name===g.away),ho=data.teams.find(t=>t.name===g.home);aw.pf+=a;aw.pa+=h;ho.pf+=h;ho.pa+=a;if(a>h){aw.w++;aw.streak="W1";ho.l++;ho.streak="L1"}else if(h>a){ho.w++;ho.streak="W1";aw.l++;aw.streak="L1"}else{aw.t++;ho.t++}save();closeModal();toast("Game saved");render()}

function scores(){
 let games=data.games.filter(g=>g.week===Number(data.settings.week));
 return pageTitle("Scores","Report and finalize results for the current week")+`${card()}<div class="flex justify-between items-center mb-4"><h3 class="text-2xl">Week ${data.settings.week}</h3><button class="btn btn-dark" onclick="go('sync')">Manual Sync</button></div>${games.map(g=>`<div class="border-b border-slate-800 py-4"><div class="font-bold mb-3">${esc(g.away)} <span class="text-slate-500">@</span> ${esc(g.home)}</div><div class="grid grid-cols-2 md:grid-cols-[1fr_100px_100px_auto] gap-2 items-end"><div class="text-xs text-slate-500 self-center">${esc(g.date)} • ${esc(g.time)}</div><input id="s-a-${g.id}" class="input" type="number" min="0" placeholder="Away" value="${g.awayScore??""}"><input id="s-h-${g.id}" class="input" type="number" min="0" placeholder="Home" value="${g.homeScore??""}"><button class="btn btn-red" onclick="submitScore('${g.id}')">Submit Score</button></div></div>`).join("")}</div>`;
}
function submitScore(id){let g=data.games.find(x=>x.id===id),a=Number(document.getElementById("s-a-"+id).value),h=Number(document.getElementById("s-h-"+id).value);if(!Number.isInteger(a)||!Number.isInteger(h)||a<0||h<0)return toast("Both scores are required","error");g.awayScore=a;g.homeScore=h;g.status="Final";save();toast("Score submitted");render()}

function rosters(){
 let t=data.teams.find(x=>x.id==selectedTeam)||data.teams[0];return pageTitle("Rosters","53-man franchise roster and depth chart")+`${card()}<div class="flex flex-col md:flex-row gap-3 justify-between mb-5"><select class="select max-w-md" onchange="selectedTeam=this.value;render()">${data.teams.map(x=>`<option value="${x.id}" ${x.id==t.id?"selected":""}>${esc(x.name)} — ${esc(x.owner)}</option>`).join("")}</select><div class="text-xs text-slate-500 self-center">Depth chart groups: QB • RB • WR • TE • OL • DL • LB • CB • S • K • P</div></div><div class="overflow-x-auto"><table><thead><tr><th>#</th><th>Name</th><th>Position</th><th>OVR</th><th>Age</th><th>Speed</th></tr></thead><tbody>${roster(t.name).map(p=>`<tr><td>${p.num}</td><td class="font-bold">${p.name}</td><td><span class="badge pending">${p.pos}</span></td><td class="font-black">${p.ovr}</td><td>${p.age}</td><td>${p.speed}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function rules(){
 const secs=[["General Rules",["All games are played on the agreed league Madden settings.","Owners must communicate promptly and maintain sportsmanlike conduct.","The commissioner has final authority on disputes and league integrity."]],["Trade Rules",["Trades have a 48-hour review window.","Commissioner approval is required before a trade is final.","No collusion, roster dumping, or intentional competitive imbalance."]],["Scheduling Rules",["Games must be scheduled within 48 hours of the weekly slate opening.","Games must be played within 72 hours unless an extension is approved.","Owners should use the scheduling channel for availability."]],["Discipline Policy",["Late game: $5,000 fine.","No-show: $10,000 fine.","Unsportsmanlike conduct: $25,000 fine.","Repeated violations may result in suspension or removal."]],["Playoff Rules",["Playoff seeding follows regular-season standings.","Commissioner may resolve scheduling conflicts to protect the bracket.","Playoff games must be completed on the published deadline."]],["Madden Sync Rules",["Sync after each completed game.","Use the official Companion App URL configured by the league.","Manual score entry may be used if sync is unavailable, subject to commissioner review."]]];
 return pageTitle("Rules","RMNFL official league rulebook")+`<div class="grid md:grid-cols-2 gap-5">${secs.map(s=>`${card()}<h3 class="text-2xl mb-3">${s[0]}</h3><ul class="space-y-2 text-sm text-slate-300">${s[1].map(x=>`<li class="flex gap-2"><span class="text-red-500">•</span><span>${esc(x)}</span></li>`).join("")}</ul></div>`).join("")}</div>`;
}
function trade(){
 return pageTitle("Trade Block","Players currently available for trade")+`${card()}<form onsubmit="addTrade(event)" class="grid md:grid-cols-2 lg:grid-cols-3 gap-3 mb-6"><div><label class="label">Owner Name</label><input name="owner" class="input" required></div><div><label class="label">Team</label><select name="team" class="select" required>${data.teams.map(t=>`<option>${esc(t.name)}</option>`).join("")}</select></div><div><label class="label">Player Name</label><input name="player" class="input" required></div><div><label class="label">Position</label><select name="pos" class="select">${POS.map(p=>`<option>${p}</option>`).join("")}</select></div><div><label class="label">OVR</label><input name="ovr" class="input" type="number" min="1" max="99" required></div><div><label class="label">Asking Price / Notes</label><input name="notes" class="input" required></div><button class="btn btn-red md:col-span-2 lg:col-span-3">Submit to Trade Block</button></form><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-3">${data.trades.map((t,i)=>`${card()}<div class="flex justify-between"><span class="badge scheduled">${esc(t.pos)} • ${t.ovr} OVR</span><button class="text-slate-500" onclick="deleteTrade(${i})">${icon("x",15)}</button></div><h3 class="text-2xl mt-3">${esc(t.player)}</h3><div class="text-sm text-slate-400">${esc(t.team)} • ${esc(t.owner)}</div><p class="text-sm text-slate-300 mt-3">${esc(t.notes)}</p></div>`).join("")||empty("No players on the block")}</div></div>`;
}
function addTrade(e){e.preventDefault();let f=new FormData(e.target);data.trades.unshift({owner:f.get("owner"),team:f.get("team"),player:f.get("player"),pos:f.get("pos"),ovr:Number(f.get("ovr")),notes:f.get("notes")});save();toast("Trade block entry added");render()}
function deleteTrade(i){data.trades.splice(i,1);save();toast("Trade block entry removed");render()}

function media(){
 return pageTitle("Media","Broadcasts, highlights, and stream schedule")+`<div class="grid lg:grid-cols-2 gap-5">${card()}<h3 class="text-2xl mb-4">League Broadcast</h3><div class="aspect-video bg-black rounded-lg grid place-items-center text-slate-500"><div class="text-center">${icon("play-circle",45)}<div class="mt-2">Paste your YouTube/Twitch embed URL in Admin</div></div></div><div class="mt-4 flex gap-2"><input class="input" value="${esc(data.settings.youtube)}" readonly><button class="btn btn-red" onclick="copyText('${esc(data.settings.youtube)}')">${icon("copy",15)} Copy</button></div></div>${card()}<h3 class="text-2xl mb-4">Recent Highlights</h3><div class="space-y-3">${data.highlights.map((h,i)=>`<div class="p-3 rounded-lg bg-slate-900 border border-slate-800 flex gap-3"><span class="text-red-500 font-black">0${i+1}</span>${esc(h)}</div>`).join("")}</div><h3 class="text-2xl mt-6 mb-3">Stream Schedule</h3>${data.streamSchedule.map(s=>`<div class="flex justify-between border-b border-slate-800 py-3"><span>${esc(s.title)}</span><span class="text-slate-400">${esc(s.date)}</span></div>`).join("")}</div></div>`;
}
function owner(){
 return pageTitle("Owner Portal","Private team dashboard stored locally in this browser")+`${card()}<div id="owner-root">${ownerSession?ownerDash():ownerLogin()}</div></div>`;
}
let ownerSession=JSON.parse(sessionStorage.getItem("rmnflOwner")||"null");
function ownerLogin(){return `<form onsubmit="ownerLoginSubmit(event)" class="max-w-md mx-auto"><div class="text-center mb-5">${icon("shield-check",42)}<h3 class="text-3xl mt-2">Owner Login</h3><p class="text-sm text-slate-500">Use your team and league password.</p></div><label class="label">Team</label><select name="team" class="select mb-3">${data.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><label class="label">Password</label><input name="password" class="input mb-4" type="password" required><button class="btn btn-red w-full">Login</button></form>`}
function ownerLoginSubmit(e){e.preventDefault();let f=new FormData(e.target),t=data.teams.find(x=>x.id==f.get("team"));if(!t||f.get("password")!==t.password)return toast("Invalid team password","error");ownerSession={id:t.id};sessionStorage.setItem("rmnflOwner",JSON.stringify(ownerSession));render();toast("Owner portal unlocked")}
function ownerDash(){let t=data.teams.find(x=>x.id===ownerSession.id)||data.teams[0],gs=data.games.filter(g=>g.away===t.name||g.home===t.name).slice(0,8);return `<div class="flex justify-between items-center mb-5"><div><div class="text-xs text-slate-500">LOGGED IN AS</div><h3 class="text-3xl">${esc(t.name)}</h3><div class="text-sm text-slate-400">${esc(t.owner)}</div></div><button class="btn btn-dark" onclick="sessionStorage.removeItem('rmnflOwner');ownerSession=null;render()">Logout</button></div><div class="grid md:grid-cols-4 gap-3 mb-5">${[["Record",`${t.w}-${t.l}-${t.t}`],["PF",t.pf],["PA",t.pa],["Streak",t.streak]].map(x=>`<div class="p-4 bg-slate-900 rounded-lg"><div class="text-xs text-slate-500">${x[0]}</div><div class="text-2xl font-black mt-1">${x[1]}</div></div>`).join("")}</div><div class="grid lg:grid-cols-2 gap-5"><div><h3 class="text-2xl mb-3">My Schedule</h3>${gs.map(gameRow).join("")}</div><div><h3 class="text-2xl mb-3">My Roster</h3><div class="max-h-80 overflow-auto">${roster(t.name).slice(0,15).map(p=>`<div class="flex justify-between border-b border-slate-800 py-2 text-sm"><span>${p.name}</span><span>${p.pos} • ${p.ovr}</span></div>`).join("")}</div></div></div><div class="mt-5 p-4 rounded-lg bg-red-950/20 border border-red-900/30"><div class="font-bold">Trade Requests</div><div class="text-sm text-slate-400 mt-1">${data.trades.filter(x=>x.team===t.name).length} active trade block entries for your team.</div></div>`}

function sync(){
 return pageTitle("Madden Sync","Companion App workflow and synchronization log")+`<div class="grid lg:grid-cols-3 gap-5"><div class="lg:col-span-2">${card()}<div class="flex items-center justify-between gap-3"><div><h3 class="text-2xl">Sync Status</h3><div class="text-sm text-slate-400 mt-1">Last Synced: ${data.syncLog[0]?.timestamp||"Never"}</div></div><span class="badge ${data.syncLog[0]?.status==="SYNCED"?"final":"pending"}">${data.syncLog[0]?.status||"PENDING"}</span></div><div class="grid grid-cols-2 gap-3 mt-5"><div class="p-4 bg-slate-900 rounded-lg"><div class="text-xs text-slate-500">Games Synced</div><div class="text-2xl font-black">${data.syncLog.reduce((a,x)=>a+(Number(x.games)||0),0)}</div></div><div class="p-4 bg-slate-900 rounded-lg"><div class="text-xs text-slate-500">League Week</div><div class="text-2xl font-black">${data.settings.week}</div></div></div></div>${card()}<h3 class="text-2xl mb-3">Companion App URL</h3><input id="companion" class="input mb-2" value="${esc(data.settings.companion)}"><div class="flex gap-2"><button class="btn btn-red flex-1" onclick="copyText(document.getElementById('companion').value)">Copy</button><button class="btn btn-dark" onclick="openUrl(document.getElementById('companion').value)">Open</button></div></div></div>
 <div class="grid lg:grid-cols-2 gap-5 mt-5">${card()}<h3 class="text-2xl mb-4">How to Sync</h3><ol class="space-y-4 text-sm">${["Download the Madden Companion App","Open the app","Tap Join League","Paste the league URL above","Sync after each game"].map((x,i)=>`<li class="flex gap-3"><span class="w-7 h-7 rounded-full bg-red-600 grid place-items-center font-black shrink-0">${i+1}</span><span>${x}</span></li>`).join("")}</ol></div>${card()}<h3 class="text-2xl mb-4">Sync Log</h3>${data.syncLog.map(x=>`<div class="grid grid-cols-4 gap-2 text-xs border-b border-slate-800 py-3"><span>${esc(x.timestamp)}</span><span>${esc(x.type)}</span><span>${esc(x.status)}</span><span>${x.games}</span></div>`).join("")||empty("No sync events yet")}</div></div>
 <div class="mt-5">${card()}<h3 class="text-2xl mb-4">Manual Score Entry</h3><form onsubmit="manualSync(event)" class="grid md:grid-cols-5 gap-3"><input name="week" class="input" type="number" min="1" max="18" placeholder="Week" required><select name="game" class="select md:col-span-2">${data.games.map(g=>`<option value="${g.id}">W${g.week}: ${esc(g.away)} @ ${esc(g.home)}</option>`).join("")}</select><input name="home" class="input" type="number" min="0" placeholder="Home" required><input name="away" class="input" type="number" min="0" placeholder="Away" required><button class="btn btn-red md:col-span-5">Submit & Sync</button></form></div></div>`;
}
function manualSync(e){e.preventDefault();let f=new FormData(e.target),g=data.games.find(x=>x.id===f.get("game")),h=Number(f.get("home")),a=Number(f.get("away"));if(!g||!Number.isInteger(h)||!Number.isInteger(a))return toast("Invalid manual score","error");g.homeScore=h;g.awayScore=a;g.status="Final";data.syncLog.unshift({timestamp:new Date().toLocaleString(),type:"Manual Score",status:"SYNCED",games:1});save();toast("Score synced");render()}

function discord(){
 let channels=[["📣","announcements"],["📋","rules"],["🏈","scores"],["💬","general"],["⚡","discipline"],["🎥","media"],["🏆","playoffs"],["📅","scheduling"],["🔊","voice"],["🤝","trades"]];
 return pageTitle("Discord","League communication hub")+`<div class="hero glass rounded-2xl p-7 text-center mb-5"><div class="text-5xl mb-3">💬</div><h2 class="text-5xl">JOIN THE RMNFL SERVER</h2><p class="text-slate-400 mt-2">Announcements, scheduling, scores, trades, and league communication.</p><div class="flex flex-col sm:flex-row gap-2 justify-center mt-5"><button class="btn btn-red" onclick="openUrl('${esc(data.settings.discord)}')">${icon("external-link",15)} Join Server</button><button class="btn btn-dark" onclick="copyText('${esc(data.settings.discord)}')">${icon("copy",15)} Copy Invite</button></div></div><div class="grid lg:grid-cols-2 gap-5">${card()}<h3 class="text-2xl mb-4">Channel Map</h3><div class="grid grid-cols-2 gap-2">${channels.map(x=>`<div class="bg-slate-900 rounded-lg p-3"><span class="mr-2">${x[0]}</span>${x[1]}</div>`).join("")}</div></div>${card()}<h3 class="text-2xl mb-4">Roles Guide</h3><div class="grid grid-cols-2 md:grid-cols-5 gap-2">${[["Commissioner","bg-red-600"],["Admin","bg-orange-500"],["Team Owner","bg-blue-600"],["Prospect","bg-gray-500"],["Suspended","bg-black border border-slate-700"]].map(x=>`<div class="${x[1]} rounded-lg p-3 text-center font-bold text-sm">${x[0]}</div>`).join("")}</div><h3 class="text-2xl mt-6 mb-3">Notification Settings</h3>${["Game reminders","Score updates","Trade activity","Discipline alerts","Playoff announcements"].map((x,i)=>`<label class="flex items-center justify-between border-b border-slate-800 py-3 text-sm">${x}<input type="checkbox" ${i<3?"checked":""}></label>`).join("")}</div>`;
}
function admin(){
 return pageTitle("Admin","League management console")+`${card()}<form onsubmit="adminPin(event)" class="max-w-md mx-auto"><h3 class="text-3xl mb-3 text-center">Commissioner Access</h3><p class="text-sm text-slate-500 text-center mb-4">Enter the admin PIN to manage league data.</p><input name="pin" class="input mb-3" type="password" placeholder="Admin PIN" required><button class="btn btn-red w-full">Unlock Admin</button></form></div>`;
}
function adminPin(e){e.preventDefault();if(new FormData(e.target).get("pin")!=="RMNFL2024")return toast("Incorrect admin PIN","error");renderAdmin()}
function renderAdmin(){
 document.querySelector("main").innerHTML=pageTitle("Admin Console","Changes apply immediately and persist in localStorage")+`${card()}<form onsubmit="saveSettings(event)" class="grid md:grid-cols-2 gap-3"><div><label class="label">Season Name</label><input name="season" class="input" value="${esc(data.settings.season)}" required></div><div><label class="label">Current Week</label><input name="week" class="input" type="number" min="1" max="18" value="${data.settings.week}" required></div><div><label class="label">Commissioner</label><input name="commissioner" class="input" value="${esc(data.settings.commissioner)}" required></div><div><label class="label">Discord URL</label><input name="discord" class="input" value="${esc(data.settings.discord)}"></div><div><label class="label">YouTube URL</label><input name="youtube" class="input" value="${esc(data.settings.youtube)}"></div><div><label class="label">Companion App URL</label><input name="companion" class="input" value="${esc(data.settings.companion)}"></div><button class="btn btn-red md:col-span-2">Save All Settings</button></form></div>
 <div class="grid lg:grid-cols-2 gap-5 mt-5">${card()}<h3 class="text-2xl mb-4">Manage Announcements</h3><form onsubmit="addAnnouncement(event)" class="space-y-2 mb-4"><input name="title" class="input" placeholder="Announcement title" required><textarea name="body" class="textarea" placeholder="Message" required></textarea><button class="btn btn-red">Add Announcement</button></form>${data.announcements.map((a,i)=>`<div class="flex justify-between gap-3 border-t border-slate-800 py-3"><div><b>${esc(a.title)}</b><div class="text-sm text-slate-400">${esc(a.body)}</div></div><button class="btn btn-dark" onclick="deleteAnnouncement(${i})">Delete</button></div>`).join("")}</div>${card()}<h3 class="text-2xl mb-4">Manage Teams</h3><form onsubmit="addTeam(event)" class="grid md:grid-cols-3 gap-2 mb-4"><input name="name" class="input" placeholder="Team Name" required><select name="conf" class="select"><option>AFC</option><option>NFC</option></select><input name="div" class="input" placeholder="Division" required><input name="owner" class="input" placeholder="Owner" required><input name="password" class="input" placeholder="Password" required><button class="btn btn-red">Add Team</button></form><div class="overflow-x-auto"><table><thead><tr><th>Team</th><th>Conference</th><th>Division</th><th>Owner</th><th>Action</th></tr></thead><tbody>${data.teams.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.conf}</td><td>${esc(t.div)}</td><td>${esc(t.owner)}</td><td><button class="btn btn-dark" onclick="editTeam(${t.id})">Edit</button> <button class="btn btn-dark" onclick="deleteTeam(${t.id})">Delete</button></td></tr>`).join("")}</tbody></table></div></div>
 <div class="grid lg:grid-cols-2 gap-5 mt-5">${card()}<h3 class="text-2xl mb-4">Discipline Log</h3><form onsubmit="addDiscipline(event)" class="grid grid-cols-2 gap-2"><select name="team" class="select col-span-2">${data.teams.map(t=>`<option>${esc(t.name)}</option>`).join("")}</select><input name="reason" class="input col-span-2" placeholder="Reason" required><input name="amount" class="input" type="number" min="0" placeholder="Fine Amount"><input name="type" class="input" placeholder="Fine / Suspension" required><button class="btn btn-red col-span-2">Log Discipline</button></form></div>${card()}<h3 class="text-2xl mb-4">Recent Discipline</h3>${data.discipline.map(d=>`<div class="border-b border-slate-800 py-3"><b>${esc(d.team)}</b> — ${esc(d.type)} — $${Number(d.amount||0).toLocaleString()}<div class="text-sm text-slate-400">${esc(d.reason)}</div></div>`).join("")||empty("No discipline records")}</div></div>`;
 try{lucide.createIcons()}catch(e){}
}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);Object.assign(data.settings,{season:f.get("season"),week:Number(f.get("week")),commissioner:f.get("commissioner"),discord:f.get("discord"),youtube:f.get("youtube"),companion:f.get("companion")});save();toast("League settings saved");render()}
function addAnnouncement(e){e.preventDefault();let f=new FormData(e.target);data.announcements.unshift({id:Date.now(),title:f.get("title"),body:f.get("body")});save();toast("Announcement added");renderAdmin()}
function deleteAnnouncement(i){data.announcements.splice(i,1);save();toast("Announcement deleted");renderAdmin()}
function addTeam(e){e.preventDefault();let f=new FormData(e.target);data.teams.push({id:Date.now(),name:f.get("name"),conf:f.get("conf"),div:f.get("div"),owner:f.get("owner"),password:f.get("password"),w:0,l:0,t:0,pf:0,pa:0,streak:"-"});save();toast("Team added");renderAdmin()}
function deleteTeam(id){if(data.teams.length<=2)return toast("Keep at least two teams","error");if(!confirm("Delete this team?"))return;data.teams=data.teams.filter(t=>t.id!==id);save();toast("Team deleted");renderAdmin()}
function editTeam(id){let t=data.teams.find(x=>x.id===id);modal(`<h3 class="text-3xl mb-4">Edit Team</h3><div class="space-y-3"><input id="et-name" class="input" value="${esc(t.name)}"><input id="et-owner" class="input" value="${esc(t.owner)}"><input id="et-pass" class="input" value="${esc(t.password)}"><button class="btn btn-red w-full" onclick="saveTeam(${id})">Save Team</button></div>`)}
function saveTeam(id){let t=data.teams.find(x=>x.id===id);t.name=document.getElementById("et-name").value;t.owner=document.getElementById("et-owner").value;t.password=document.getElementById("et-pass").value;save();closeModal();toast("Team updated");renderAdmin()}
function addDiscipline(e){e.preventDefault();let f=new FormData(e.target);data.discipline.unshift({team:f.get("team"),reason:f.get("reason"),amount:Number(f.get("amount")||0),type:f.get("type"),date:new Date().toLocaleString()});save();toast("Discipline record added");renderAdmin()}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast("Copied to clipboard")).catch(()=>{let x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove();toast("Copied to clipboard")})}
function openUrl(u){if(!/^https?:\\/\\//i.test(u))return toast("URL must start with http:// or https://","error");window.open(u,"_blank","noopener")}
function modal(inner){let m=document.createElement("div");m.id="modal";m.className="modal";m.innerHTML=`<div class="modal-card glass rounded-xl p-5">${inner}<button class="btn btn-dark w-full mt-3" onclick="closeModal()">Cancel</button></div>`;document.body.appendChild(m)}
function closeModal(){document.getElementById("modal")?.remove()}

function render(){
 try{
  let content={home:home,standings:standings,schedule:schedule,scores:scores,rosters:rosters,rules:rules,trade:trade,media:media,owner:owner,sync:sync,discord:discord,admin:admin}[view]||home;
  shell(content());
 }catch(e){
  document.getElementById("app").innerHTML=`<div style="padding:40px;color:white;font-family:Inter"><h1 style="font-size:42px;color:#dc2626">RMNFL</h1><h2>Application Error</h2><p style="color:#94a3b8">The app hit an unexpected error but did not go blank.</p><pre style="white-space:pre-wrap;color:#fca5a5">${esc(e.stack||e.message)}</pre><button class="btn btn-red" onclick="localStorage.removeItem('rmnflData');location.reload()">Reset Local League Data</button></div>`;
 }
}
render();
</script>
